<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventura 102 | Official Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --black: #000000;
            --border-thickness: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            
            /* --- PERBAIKAN URL BACKGROUND --- */
            /* Pastikan file 'bg ventura.png' ada di folder yang sama dengan file html ini */
            background-image: url('bg ventura.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            background-color: var(--black); /* Fallback warna hitam */
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); 
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .profile-card {
            background: var(--white);
            border: var(--border-thickness) solid var(--black);
            padding: 30px 20px;
            box-shadow: 10px 10px 0px var(--black);
            margin-bottom: 30px;
            text-align: center;
        }

        .logo-box {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border: var(--border-thickness) solid var(--black);
            background: #fff;
            padding: 5px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            color: var(--black);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .tagline {
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.75rem;
            background: var(--black);
            color: var(--white);
            padding: 4px 10px;
            display: inline-block;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            background: var(--white);
            border: var(--border-thickness) solid var(--black);
            color: var(--black);
            padding: 18px;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            font-size: 1.1rem;
            box-shadow: 6px 6px 0px var(--black);
            transition: 0.1s;
        }

        .link-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 10px 10px 0px var(--black);
            background: var(--black);
            color: var(--white);
        }

        .link-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--black);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--white);
            font-weight: 900;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px var(--black);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="logo-box">
                <img src="image_6d3c46.jpg" alt="Logo Ventura 102">
            </div>
            <h1>VENTURA 102</h1>
            <span class="tagline">Football Culture • Supply Co.</span>
        </div>

        <div class="links-list">
            <a href="#" class="link-btn">Contact WhatsApp</a>
            <a href="#" class="link-btn">Shopee</a>
            <a href="#" class="link-btn">Tokopedia</a>
            <a href="#" class="link-btn">Instagram</a>
        </div>

        <footer>
            &copy; 2026 VENTURA 102 SUPPLY CO.
        </footer>
    </div>

</body>
</html>
